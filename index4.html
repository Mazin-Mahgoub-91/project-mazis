<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<title>يشتغل في فايرفوكس - Whisper</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:15px}
button{padding:14px 25px;background:#0f0;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin:5px}
#out{max-width:900px;margin:15px auto;min-height:120px;border:2px solid #0f0;padding:15px;font-size:24px;background:#111}
#log{background:#222;color:#ff0;padding:10px;max-width:900px;margin:auto;text-align:left;direction:ltr;min-height:60px}
</style>
</head>
<body>
<h2>🎤 نسخة فايرفوكس - بطبع كلام الفم بدون كروم</h2>
<p>المحرك حينزل أول مرة (30 ميقا) اصبر دقيقة</p>
<button id="start">شغل التسجيل 4 ثواني واتكلم</button>
<button id="stop">وقف وترجم</button>
<div id="out">...</div>
<div id="log">LOG: جاهز</div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

const out = document.getElementById('out');
const logEl = document.getElementById('log');
function log(t){ logEl.textContent += "\n> " + t; }

let mediaRecorder, chunks = [];
let transcriber = null;

async function loadModel(){
  log("بحمل محرك Whisper (أول مرة بتاخد دقيقة)...");
  out.textContent = "بحمل الموديل... خليك موصل بالنت";
  transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-small');
  log("الموديل اتحمل ✅ هسي دوس شغل واتكلم");
  out.textContent = "جاهز - دوس شغل واتكلم بصوت واضح";
}

loadModel();

document.getElementById('start').onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder = new MediaRecorder(stream);
  chunks = [];
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = async () => {
    log("بترجم الإشارة لنص...");
    out.textContent = "بترجم...";
    const blob = new Blob(chunks, {type:'audio/webm'});
    const arrayBuffer = await blob.arrayBuffer();
    // تحويل الصوت لنص بالإشارة الخام
    const result = await transcriber(arrayBuffer, {language: 'arabic', task: 'transcribe'});
    out.textContent = result.text;
    log("النتيجة: " + result.text);
  };
  mediaRecorder.start();
  log("بسجل لمدة 4 ثواني - اتكلم هسي");
  out.textContent = "🎙️ بسجل... اتكلم";
  setTimeout(()=> mediaRecorder.stop(), 4000);
};

document.getElementById('stop').onclick = () => {
  if(mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
};
</script>
</body>
</html>
